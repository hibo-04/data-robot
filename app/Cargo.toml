[package]
name = "octa-app"
version = "0.1.0"
edition = "2021"
description = "B2B product app around the analytics engine (working title: Octa). Roadmap: docs/roadmap.md"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
